appId: io.github.innovativefluid.Jollyboat
productName: Jollyboat
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # venmic ships its build tree in the npm package; only lib/ and prebuilds/ run
  - '!node_modules/@vencord/venmic/{src,include,private,addon,cmake,CMakeLists.txt,flake.nix,README.md}'
  - '!node_modules/{cmake-js,node-addon-api}/**'
asar: true
# native modules (venmic on linux) must live outside the archive; the prebuilt N-API binaries
# are used as they are, nothing is recompiled for electron
asarUnpack:
  - '**/*.node'
extraResources:
  - from: THIRD_PARTY_NOTICES.md
  - from: LICENSE
npmRebuild: false
# harden the binary: no node from the outside, only our asar runs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# updates: electron-updater reads latest.yml from the GitHub release
publish:
  provider: github
  owner: innovativefluid
  repo: jollyboat

# x64 and arm64 go into one installer that installs the matching build (electron-updater reads a
# single latest.yml on windows, so one installer is what keeps updates working on both)
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}

# EXPERIMENTAL: built by CI, never run on a real mac by the developers. one universal dmg (intel
# and apple silicon, macos 13+), ad-hoc signed only: no apple developer id, so no notarization
# and no self-update (the app shows a notice instead). the name says so on purpose
mac:
  target:
    - target: dmg
      arch: universal
  icon: build/icon.png
  category: public.app-category.social-networking
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-universal-EXPERIMENTAL.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Sharkord voice chat uses your microphone.
    NSCameraUsageDescription: Sharkord video uses your camera.
    NSAudioCaptureUsageDescription: Screen shares can include the sound your Mac plays.
dmg:
  title: Jollyboat ${version} (experimental)

linux:
  target:
    - flatpak
  # a directory of NxN.png files: nearest-scaled pixel art, never smoothed by the packager
  icon: build/icons
  category: Network
  synopsis: Desktop client for Sharkord servers
  desktop:
    entry:
      StartupWMClass: jollyboat
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '24.08'
  finishArgs:
    - --share=ipc
    - --share=network
    - --socket=wayland
    - --socket=fallback-x11
    - --socket=pulseaudio
    - --filesystem=xdg-run/pipewire-0
    - --filesystem=xdg-config/autostart:create
    - --device=dri
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
    - --talk-name=org.freedesktop.portal.Desktop
    # the keyring (safeStorage) behind libsecret; without it passwords fall back to plain storage
    - --talk-name=org.freedesktop.secrets
    - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
