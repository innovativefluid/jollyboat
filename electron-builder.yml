appId: net.innovativefluid.Jollyboat
productName: Jollyboat
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # venmic ships its build tree in the npm package; only lib/ and prebuilds/ run
  - '!node_modules/@vencord/venmic/{src,include,private,addon,cmake,CMakeLists.txt,flake.nix,README.md}'
  - '!node_modules/{cmake-js,node-addon-api}/**'
asar: true
# native modules (venmic on linux) must live outside the archive; the prebuilt N-API binaries
# are used as they are, nothing is recompiled for electron
asarUnpack:
  - '**/*.node'
extraResources:
  - from: THIRD_PARTY_NOTICES.md
  - from: LICENSE
npmRebuild: false
# harden the binary: no node from the outside, only our asar runs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# updates: electron-updater reads latest.yml from the GitHub release
publish:
  provider: github
  owner: innovativefluid
  repo: jollyboat

# x64 and arm64 go into one installer that installs the matching build (electron-updater reads a
# single latest.yml on windows, so one installer is what keeps updates working on both)
win:
  target:
    - nsis
  icon: build/icon.ico
  # the keyboard hook (push-to-talk) runs on windows only: its other prebuilds stay out
  files:
    - '!node_modules/uiohook-napi/prebuilds/{linux,darwin}*/**'
    - '!node_modules/uiohook-napi/{src,libuiohook,binding.gyp}'
  # one app's sound for a screen share (native/win-audio, built by CI for each architecture)
  extraResources:
    - from: build/win-audio/${arch}/jollyboat-audio.exe
      to: jollyboat-audio.exe
# sharkord:// links (the official Sharkord Desktop's add-server links): macos takes the scheme from
# Info.plist; windows registers it at runtime (src/main/deeplinks.ts), linux in the desktop entry
protocols:
  - name: Sharkord
    schemes:
      - sharkord

nsis:
  # the guid electron-builder derived from the old app id (io.github.innovativefluid.Jollyboat):
  # pinned, so updates keep replacing the same installation
  guid: c1b9fc12-fe34-5909-a980-78bb05ab776f
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  # file names: Jollyboat-<version>-<platform>-<arch>[-<kind>]; universal = x64 and arm64 in one
  artifactName: ${productName}-${version}-windows-universal-setup.${ext}

# the portable exe: no installer, settings in a Jollyboat-data folder next to it, one per
# architecture (built in two runs, see dist:win), no self-update (the app shows a notice)
portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}

# one universal dmg (intel and apple silicon, macos 13+), ad-hoc signed only: no apple developer
# id, so no notarization and no self-update (the app shows a notice instead)
mac:
  files:
    - '!node_modules/uiohook-napi/**'
  target:
    - target: dmg
      arch: universal
  icon: build/icon.png
  category: public.app-category.social-networking
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-universal.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Sharkord voice chat uses your microphone.
    NSCameraUsageDescription: Sharkord video uses your camera.
    NSAudioCaptureUsageDescription: Screen shares can include the sound your Mac plays.
dmg:
  title: Jollyboat ${version}

# linux ships as a flatpak built from source by flatpak-builder (flatpak/), which runs
# `electron-builder --linux dir` inside the sandbox; the same build goes to flathub and to the
# github releases
linux:
  # linux takes keys from the desktop's shortcut portal, not the keyboard hook
  files:
    - '!node_modules/uiohook-napi/**'
  # dir for the flatpak (built from it, see flatpak/); the appimage with `npm run dist:appimage`
  target:
    - dir
  executableName: jollyboat
  category: Network
  synopsis: Sharkord client
  desktop:
    entry:
      Name: Jollyboat
      Comment: Sharkord client
      StartupWMClass: net.innovativefluid.Jollyboat

# the self-updating linux build (electron-updater replaces the file from latest-linux*.yml). the
# static-runtime toolset: no libfuse2 needed, and its AppRun adds --no-sandbox only where user
# namespaces are blocked (ubuntu 24.04+'s apparmor rule), where electron could not start otherwise
toolsets:
  appimage: '1.0.3'
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
