# Release from the Actions tab: Run workflow → version → the tag is created, both installers are
# built, and a draft release with notes is opened. Publish it under Releases when it looks right.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to release (must match package.json), e.g. 0.1.0
        required: true
      prerelease:
        description: mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "package.json says $pkg, you asked for ${{ inputs.version }}"; exit 1
          fi
          tag="v${{ inputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # a tag left by a run that never got to publish (a cancelled build, say) is moved to this
          # commit and reused; a tag with a published release is a mistake and stops here
          force=""
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            published=$(gh release view "$tag" --json isDraft --jq '.isDraft | not' 2>/dev/null || echo false)
            if [ "$published" = "true" ]; then
              echo "$tag is already released"; exit 1
            fi
            echo "$tag exists but was never published: moving it to this commit"
            force="-f"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag $force -a "$tag" -m "Jollyboat ${{ inputs.version }}"
          git push $force origin "$tag"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with: { targets: main }

  # the experimental mac build on its own: macos runners are sometimes not available for hours,
  # so the release does not wait for it; the dmg is added to the draft when (if) it is done
  mac:
    needs: tag
    uses: ./.github/workflows/build.yml
    with: { targets: mac }

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      # only the installers (the unpacked smoke-test build is not for release)
      - uses: actions/download-artifact@v8
        with: { name: windows, path: artifacts/windows }
      - uses: actions/download-artifact@v8
        with: { pattern: 'linux-*', path: artifacts }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: artifacts/**/*
          body: |
            **Download one file:**
            - Windows: `Jollyboat-Setup-${{ inputs.version }}.exe` (x64 and ARM in one)
            - Linux: `Jollyboat-${{ inputs.version }}-x86_64.flatpak`, or `-aarch64` on ARM
            - Mac (experimental, untested): `Jollyboat-${{ inputs.version }}-mac-universal-EXPERIMENTAL.dmg`. To open it the first time: System Settings → Privacy & Security → Open Anyway.

            `latest.yml` and `.blockmap` are read by installed copies when they check for updates; ignore them.

          generate_release_notes: true
          draft: true
          prerelease: ${{ inputs.prerelease }}

  attach-mac:
    needs: [tag, release, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: mac-experimental, path: mac }
      - name: Add the mac dmg to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ needs.tag.outputs.tag }}" mac/*.dmg --clobber --repo "${{ github.repository }}"
