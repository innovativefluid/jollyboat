name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # the release builds the mac app separately, so a missing macos runner cannot hold it up
      targets: { type: string, default: all, description: 'all | main (windows + linux) | mac' }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      # the packaged app starts, renders the setup window and the bar, and exits (see runSmokeTest)
      - name: Smoke test (x64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 dist/win-unpacked
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      # for the arm64 smoke test on an arm runner; not part of a release
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-arm64
          path: dist/win-arm64-unpacked
          retention-days: 3

  windows-arm64-smoke:
    needs: windows
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: smoke-windows-arm64, path: app }
      - name: Smoke test (arm64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 app

  # EXPERIMENTAL mac build: universal dmg, ad-hoc signed; the smoke test runs both slices (arm64
  # natively, x64 under rosetta) since nobody on the project has a mac
  mac:
    needs: check
    if: ${{ inputs.targets != 'main' }}
    runs-on: macos-latest
    timeout-minutes: 45
    # experimental: a failing mac build must never hold back a windows / linux release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - name: Smoke test (arm64 and x64)
        shell: bash
        run: |
          app=$(ls -d dist/mac-universal/*.app | head -1)
          bin="$app/Contents/MacOS/Jollyboat"
          lipo -archs "$bin"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -3 | sed 's/^/::notice title=codesign::/' || true
          # macos has no gnu timeout: a guard kills it by hand. the outcome and the log tail
          # go into annotations, which stay readable when the full log is not
          # usage: smoke <log> <seconds> <command...> (rosetta translates electron on first start, slowly)
          smoke() {
            local log=$1 limit=$2; shift 2
            local start=$SECONDS rc=0
            ELECTRON_ENABLE_LOGGING=1 JOLLYBOAT_SMOKE=1 "$@" > "$log" 2>&1 & local pid=$!
            ( sleep "$limit"; kill -9 $pid 2>/dev/null ) & local guard=$!
            wait $pid || rc=$?
            kill $guard 2>/dev/null || true
            echo "::notice title=smoke $log::exit $rc after $((SECONDS - start)) s"
            grep -E 'smoke|ERROR|FATAL|Killed|crash' "$log" | tail -12 | sed "s/^/::notice title=$log::/" || true
            return $rc
          }
          smoke smoke-arm64.log 120 "$bin"
          grep -q '^\[smoke\] darwin arm64' smoke-arm64.log
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            smoke smoke-x64.log 300 arch -x86_64 "$bin"
            grep -q '^\[smoke\] darwin x64' smoke-x64.log
          else
            echo "::warning::rosetta is not installed on this runner, the x64 slice was not started"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mac-experimental
          path: dist/*.dmg

  # built from source with flatpak-builder, from the same manifest Flathub uses; the GitHub copy
  # only differs in looking for new releases on GitHub (Flathub delivers its own updates)
  linux-flatpak:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak and the runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Lint the manifest
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/net.innovativefluid.Jollyboat.yml || true
      - name: Build
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          sed 's/JOLLYBOAT_CHANNEL=flathub/JOLLYBOAT_CHANNEL=github/' flatpak/net.innovativefluid.Jollyboat.yml > flatpak/github.yml
          flatpak run org.flatpak.Builder --user --disable-rofiles-fuse --force-clean --repo=flatpak/repo \
            --default-branch=stable flatpak/build-dir flatpak/github.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo "Jollyboat-$version-${{ matrix.arch }}.flatpak" net.innovativefluid.Jollyboat stable
      - name: Lint the build
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak/repo || true
      # the installed bundle: starts in the sandbox, renders the setup window and the bar, exits
      - name: Smoke test
        shell: bash
        run: |
          flatpak install --user -y --noninteractive "Jollyboat-$version-${{ matrix.arch }}.flatpak"
          JOLLYBOAT_SMOKE=1 timeout 180 dbus-run-session -- xvfb-run -a \
            flatpak run --env=JOLLYBOAT_SMOKE=1 net.innovativefluid.Jollyboat 2>&1 | tee smoke.log
          grep -q '^\[smoke\] linux' smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: Jollyboat-*.flatpak
