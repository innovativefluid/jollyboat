name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # the release builds the mac app separately, so a missing macos runner cannot hold it up
      targets: { type: string, default: all, description: 'all | main (windows + linux) | mac' }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      # the packaged app starts, renders the setup window and the bar, and exits (see runSmokeTest)
      - name: Smoke test (x64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 dist/win-unpacked
      # the portable exe: unpacks itself, keeps its data next to it (Jollyboat-data\smoke.log)
      - name: Smoke test (portable x64)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*-windows-x64-portable.exe' | Select-Object -First 1
          $env:JOLLYBOAT_SMOKE = '1'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'portable smoke test timed out' }
          $log = Join-Path $exe.DirectoryName 'Jollyboat-data\smoke.log'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $log)) { throw "no smoke.log next to the portable exe (exit $($p.ExitCode))" }
          $line = Get-Content $log
          Write-Output $line
          Write-Output "::notice title=portable smoke::$line"
          if ($line -notmatch '^\[smoke\] win32 x64 .*portable') { throw 'unexpected smoke line' }
          Remove-Item -Recurse -Force (Join-Path $exe.DirectoryName 'Jollyboat-data')
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      # for the arm64 smoke test on an arm runner; not part of a release
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-arm64
          path: dist/win-arm64-unpacked
          retention-days: 3

  windows-arm64-smoke:
    needs: windows
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: smoke-windows-arm64, path: app }
      - name: Smoke test (arm64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 app

  # EXPERIMENTAL mac build: universal dmg, ad-hoc signed; the smoke test runs both slices (arm64
  # natively, x64 under rosetta) since nobody on the project has a mac
  mac:
    needs: check
    if: ${{ inputs.targets != 'main' }}
    # an intel mac: github's apple silicon macs were often out of capacity ("job was not
    # acquired"). the dmg is universal either way; the smoke test starts whatever this cpu runs
    runs-on: macos-15-intel
    timeout-minutes: 45
    # experimental: a failing mac build must never hold back a windows / linux release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - name: Smoke test
        shell: bash
        run: |
          app=$(ls -d dist/mac-universal/*.app | head -1)
          bin="$app/Contents/MacOS/Jollyboat"
          lipo -archs "$bin"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -3 | sed 's/^/::notice title=codesign::/' || true
          # macos has no gnu timeout: a guard kills it by hand. the outcome and the log tail
          # go into annotations, which stay readable when the full log is not
          # usage: smoke <log> <seconds> <command...> (rosetta translates electron on first start, slowly)
          smoke() {
            local log=$1 limit=$2; shift 2
            local start=$SECONDS rc=0
            ELECTRON_ENABLE_LOGGING=1 JOLLYBOAT_SMOKE=1 "$@" > "$log" 2>&1 & local pid=$!
            ( sleep "$limit"; kill -9 $pid 2>/dev/null ) & local guard=$!
            wait $pid || rc=$?
            kill $guard 2>/dev/null || true
            echo "::notice title=smoke $log::exit $rc after $((SECONDS - start)) s"
            grep -E 'smoke|ERROR|FATAL|Killed|crash' "$log" | tail -12 | sed "s/^/::notice title=$log::/" || true
            return $rc
          }
          if [ "$(uname -m)" = arm64 ]; then
            # apple silicon: arm64 natively, x64 under rosetta
            smoke smoke-arm64.log 120 "$bin"
            grep -q '^\[smoke\] darwin arm64' smoke-arm64.log
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              smoke smoke-x64.log 300 arch -x86_64 "$bin"
              grep -q '^\[smoke\] darwin x64' smoke-x64.log
            else
              echo "::warning::rosetta is not installed on this runner, the x64 slice was not started"
            fi
          else
            # intel: only the x64 slice can run here
            smoke smoke-x64.log 120 "$bin"
            grep -q '^\[smoke\] darwin x64' smoke-x64.log
            echo "::notice title=smoke::intel runner: the arm64 slice was built but not started"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mac-experimental
          path: dist/*.dmg

  # built from source with flatpak-builder, from the same manifest Flathub uses; the GitHub copy
  # only differs in looking for new releases on GitHub (Flathub delivers its own updates)
  linux-flatpak:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, file: x64, runner: ubuntu-latest }
          - { arch: aarch64, file: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak and the runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "::notice title=flathub branches::$(flatpak remote-ls --user --all flathub --columns=ref | grep -E 'Electron2.BaseApp|Sdk.Extension.node2[0-9]/|/org.freedesktop.Sdk/' | grep "/$(uname -m | sed s/arm64/aarch64/)/" | sort | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.node24//26.08 org.electronjs.Electron2.BaseApp//26.08
      # step output also goes into an annotation (newlines as %0A): annotations stay readable
      # through the API when the log archive is not
      - name: Lint the manifest
        shell: bash
        run: |
          out=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/net.innovativefluid.Jollyboat.yml 2>&1) || true
          echo "$out"
          echo "::notice title=lint manifest::$(echo "$out" | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Build
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          sed 's/JOLLYBOAT_CHANNEL=flathub/JOLLYBOAT_CHANNEL=github/' flatpak/net.innovativefluid.Jollyboat.yml > flatpak/github.yml
          rc=0
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=flatpak/repo \
            --default-branch=stable flatpak/build-dir flatpak/github.yml > build.log 2>&1 || rc=$?
          tail -n 400 build.log
          if [ $rc -ne 0 ]; then
            echo "::error title=flatpak-builder (exit $rc)::$(grep -v '^\s*$' build.log | tail -n 70 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $rc
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo "Jollyboat-$version-linux-${{ matrix.file }}.flatpak" net.innovativefluid.Jollyboat stable
          ls -la Jollyboat-*.flatpak
      - name: Lint the build
        shell: bash
        run: |
          out=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak/repo 2>&1) || true
          echo "$out"
          echo "::notice title=lint build::$(echo "$out" | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
      # the installed bundle: starts in the sandbox, renders the setup window and the bar, exits
      - name: Smoke test
        shell: bash
        run: |
          flatpak install --user -y --noninteractive "Jollyboat-$version-linux-${{ matrix.file }}.flatpak"
          rc=0
          timeout 180 dbus-run-session -- xvfb-run -a \
            flatpak run --env=JOLLYBOAT_SMOKE=1 net.innovativefluid.Jollyboat > smoke.log 2>&1 || rc=$?
          cat smoke.log
          echo "::notice title=smoke (exit $rc)::$(grep -v '^\s*$' smoke.log | tail -n 40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -q '^\[smoke\] linux' smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: Jollyboat-*.flatpak
