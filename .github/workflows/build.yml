name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # the release builds the mac app separately, so a missing macos runner cannot hold it up
      targets: { type: string, default: all, description: 'all | main (windows + linux) | mac' }
      # the release: windows downloads signed through SignPath (once the SignPath settings are
      # there: the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable)
      sign: { type: boolean, default: false }
    secrets:
      SIGNPATH_API_TOKEN: { required: false }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-latest
    env:
      # signing: asked for (a release) and set up (see .signpath/README.md)
      SIGN: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: Version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci
      # the helper that records one app's sound for a screen share (native/win-audio), for both
      # architectures; electron-builder puts the matching one next to the app (extraResources)
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Build the app-sound helper (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/win-audio/x64, build/obj-x64 | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 /W3 /MT /DUNICODE /D_UNICODE native/win-audio/jollyboat-audio.cpp /Fobuild/obj-x64/ /Fe:build/win-audio/x64/jollyboat-audio.exe /link ole32.lib mmdevapi.lib
          if ($LASTEXITCODE) { throw 'helper build failed' }
          build/win-audio/x64/jollyboat-audio.exe version
          build/win-audio/x64/jollyboat-audio.exe sessions
          Write-Output "sessions exit $LASTEXITCODE (3 = no audio device on the runner)"
          $global:LASTEXITCODE = 0
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: amd64_arm64 }
      - name: Build the app-sound helper (arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/win-audio/arm64, build/obj-arm64 | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 /W3 /MT /DUNICODE /D_UNICODE native/win-audio/jollyboat-audio.cpp /Fobuild/obj-arm64/ /Fe:build/win-audio/arm64/jollyboat-audio.exe /link ole32.lib mmdevapi.lib
          if ($LASTEXITCODE) { throw 'helper build failed' }
      # signed releases name their publisher, so installed copies check that every update comes
      # from the same one (electron-updater: publisherName in app-update.yml)
      - name: Build
        shell: pwsh
        run: |
          if ($env:SIGN -eq 'true') {
            npx electron-vite build
            if ($LASTEXITCODE) { throw 'build failed' }
            $pub = '-c.win.signtoolOptions.publisherName=SignPath Foundation'
            npx electron-builder --win nsis --x64 --arm64 --publish never $pub; if ($LASTEXITCODE) { throw 'nsis failed' }
            npx electron-builder --win portable --x64 --publish never $pub; if ($LASTEXITCODE) { throw 'portable x64 failed' }
            npx electron-builder --win portable --arm64 --publish never $pub; if ($LASTEXITCODE) { throw 'portable arm64 failed' }
          } else {
            npm run dist:win
            if ($LASTEXITCODE) { throw 'dist:win failed' }
          }
      # the packaged app starts, renders the setup window and the bar, and exits (see runSmokeTest)
      - name: Smoke test (x64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 dist/win-unpacked
      # the portable exe: unpacks itself, keeps its data next to it (Jollyboat-data\smoke.log)
      - name: Smoke test (portable x64)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*-windows-x64-portable.exe' | Select-Object -First 1
          $env:JOLLYBOAT_SMOKE = '1'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'portable smoke test timed out' }
          $log = Join-Path $exe.DirectoryName 'Jollyboat-data\smoke.log'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $log)) { throw "no smoke.log next to the portable exe (exit $($p.ExitCode))" }
          $line = Get-Content $log
          Write-Output $line
          Write-Output "::notice title=portable smoke::$line"
          if ($line -notmatch '^\[smoke\] win32 x64 .*portable') { throw 'unexpected smoke line' }
          Remove-Item -Recurse -Force (Join-Path $exe.DirectoryName 'Jollyboat-data')
      # the portable update's swap, for real: a copy of the exe takes the running exe's place (the
      # running one becomes .old), and the next start clears the .old away
      - name: Smoke test (portable update swap)
        shell: pwsh
        run: |
          $src = Get-ChildItem dist -Filter '*-windows-x64-portable.exe' | Select-Object -First 1
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'swap')
          $exe = Join-Path $dir 'Jollyboat-portable.exe'
          Copy-Item $src.FullName $exe
          Copy-Item $src.FullName (Join-Path $dir 'next.exe')
          $env:JOLLYBOAT_SMOKE = '1'
          $env:JOLLYBOAT_SMOKE_SWAP = Join-Path $dir 'next.exe'
          $p = Start-Process -FilePath $exe -PassThru; $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'swap run timed out' }
          $log = Join-Path $dir 'Jollyboat-data\smoke.log'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep 1 }
          $line = Get-Content $log
          Write-Output $line
          if ($line -notmatch '\| swap ok') { throw "swap failed: $line" }
          if (-not (Test-Path "$exe.old")) { throw 'no .old file after the swap' }
          if (Test-Path (Join-Path $dir 'next.exe')) { throw 'the new file did not move into place' }
          # the next start: the new file runs, the .old goes
          Remove-Item Env:JOLLYBOAT_SMOKE_SWAP
          Start-Sleep 3
          $p = Start-Process -FilePath $exe -PassThru; $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'second run timed out' }
          for ($i = 0; $i -lt 10 -and (Test-Path "$exe.old"); $i++) { Start-Sleep 1 }
          if (Test-Path "$exe.old") { throw 'the .old file was not cleared on the next start' }
          Write-Output "::notice title=portable update::swap ok, .old cleared on the next start"
      # signing (a release, once set up): the three downloads go to SignPath, an approver confirms
      # the request there, the signed files come back in place of the unsigned ones
      - name: Unsigned downloads, for SignPath
        id: unsigned
        if: ${{ env.SIGN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: dist/*.exe
          retention-days: 2
      - name: Sign (SignPath, waits for an approver)
        if: ${{ env.SIGN == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'jollyboat' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
          parameters: |
            version: "${{ env.VERSION }}"
      - name: Signed files in place
        if: ${{ env.SIGN == 'true' }}
        shell: pwsh
        run: |
          Copy-Item signed/*.exe dist/ -Force
          $bad = 0
          foreach ($f in Get-ChildItem dist -Filter *.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($s.Status) | $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { throw "$bad file(s) not validly signed" }
      # latest.yml and the blockmap as the files are now (signing changes them), and
      # latest-portable.json for the portable copies' own updates
      - name: Update info
        run: node tools/update-info.cjs dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/latest-portable.json
      # for the arm64 smoke test on an arm runner; not part of a release
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-windows-arm64
          path: dist/win-arm64-unpacked
          retention-days: 3

  windows-arm64-smoke:
    needs: windows
    if: ${{ inputs.targets != 'mac' }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: smoke-windows-arm64, path: app }
      - name: Smoke test (arm64)
        shell: pwsh
        run: ./tools/smoke/smoke-win.ps1 app
      - name: App-sound helper (arm64)
        shell: pwsh
        run: |
          app/resources/jollyboat-audio.exe version
          if ($LASTEXITCODE) { throw 'helper did not run' }

  # mac build: universal dmg, ad-hoc signed; the smoke test starts the slice this runner's cpu runs
  mac:
    needs: check
    if: ${{ inputs.targets != 'main' }}
    # an intel mac: github's apple silicon macs were often out of capacity ("job was not
    # acquired"). the dmg is universal either way; the smoke test starts whatever this cpu runs
    runs-on: macos-15-intel
    timeout-minutes: 45
    # mac runners are sometimes unavailable for hours: a failing mac build must never hold back a
    # windows / linux release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - name: Smoke test
        shell: bash
        run: |
          app=$(ls -d dist/mac-universal/*.app | head -1)
          bin="$app/Contents/MacOS/Jollyboat"
          lipo -archs "$bin"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -3 | sed 's/^/::notice title=codesign::/' || true
          # macos has no gnu timeout: a guard kills it by hand. the outcome and the log tail
          # go into annotations, which stay readable when the full log is not
          # usage: smoke <log> <seconds> <command...> (rosetta translates electron on first start, slowly)
          smoke() {
            local log=$1 limit=$2; shift 2
            local start=$SECONDS rc=0
            ELECTRON_ENABLE_LOGGING=1 JOLLYBOAT_SMOKE=1 "$@" > "$log" 2>&1 & local pid=$!
            ( sleep "$limit"; kill -9 $pid 2>/dev/null ) & local guard=$!
            wait $pid || rc=$?
            kill $guard 2>/dev/null || true
            echo "::notice title=smoke $log::exit $rc after $((SECONDS - start)) s"
            grep -E 'smoke|ERROR|FATAL|Killed|crash' "$log" | tail -12 | sed "s/^/::notice title=$log::/" || true
            return $rc
          }
          if [ "$(uname -m)" = arm64 ]; then
            # apple silicon: arm64 natively, x64 under rosetta
            smoke smoke-arm64.log 120 "$bin"
            grep -q '^\[smoke\] darwin arm64' smoke-arm64.log
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              smoke smoke-x64.log 300 arch -x86_64 "$bin"
              grep -q '^\[smoke\] darwin x64' smoke-x64.log
            else
              echo "::warning::rosetta is not installed on this runner, the x64 slice was not started"
            fi
          else
            # intel: only the x64 slice can run here
            smoke smoke-x64.log 120 "$bin"
            grep -q '^\[smoke\] darwin x64' smoke-x64.log
            echo "::notice title=smoke::intel runner: the arm64 slice was built but not started"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.dmg

  # built from source with flatpak-builder, from the same manifest Flathub uses; the GitHub copy
  # only differs in looking for new releases on GitHub (Flathub delivers its own updates)
  linux-flatpak:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pinned like the arm one: ubuntu-latest is moving to the ubuntu 26 beta image
          - { arch: x86_64, file: x64, runner: ubuntu-24.04 }
          - { arch: aarch64, file: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # downloads from flathub (and now and then apt) stall on the x64 runners without failing.
      # every network call gets a time limit and is killed outright when it runs out (a stalled
      # flatpak ignores the polite signal); the runtimes get three attempts
      - name: Install flatpak and the runtimes
        timeout-minutes: 30
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          timeout -k 10 300 $apt update || echo "::warning title=apt::update stalled or failed, going on with the cached lists"
          timeout -k 10 300 $apt install -y flatpak flatpak-builder xvfb dbus-daemon
          timeout -k 10 120 flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "::notice title=flathub branches::$(timeout -k 10 120 flatpak remote-ls --user --all flathub --columns=ref | grep -E 'Electron2.BaseApp|Sdk.Extension.node2[0-9]/|/org.freedesktop.Sdk/' | grep "/$(uname -m | sed s/arm64/aarch64/)/" | sort | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
          for attempt in 1 2 3; do
            if timeout -k 15 240 flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
                org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
                org.freedesktop.Sdk.Extension.node24//26.08 org.electronjs.Electron2.BaseApp//26.08; then
              break
            fi
            echo "::warning title=flathub::runtime download attempt $attempt failed or stalled"
            [ $attempt = 3 ] && exit 1
            sleep 10
          done
      # step output also goes into an annotation (newlines as %0A): annotations stay readable
      # through the API when the log archive is not
      - name: Lint the manifest
        shell: bash
        run: |
          out=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/net.innovativefluid.Jollyboat.yml 2>&1) || true
          echo "$out"
          echo "::notice title=lint manifest::$(echo "$out" | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Build
        timeout-minutes: 30
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          sed 's/JOLLYBOAT_CHANNEL=flathub/JOLLYBOAT_CHANNEL=github/' flatpak/net.innovativefluid.Jollyboat.yml > flatpak/github.yml
          rc=0
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=flatpak/repo \
            --default-branch=stable flatpak/build-dir flatpak/github.yml > build.log 2>&1 || rc=$?
          tail -n 400 build.log
          if [ $rc -ne 0 ]; then
            echo "::error title=flatpak-builder (exit $rc)::$(grep -v '^\s*$' build.log | tail -n 70 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $rc
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo "Jollyboat-$version-linux-${{ matrix.file }}.flatpak" net.innovativefluid.Jollyboat stable
          ls -la Jollyboat-*.flatpak
      - name: Lint the build
        shell: bash
        run: |
          out=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak/repo 2>&1) || true
          echo "$out"
          echo "::notice title=lint build::$(echo "$out" | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
      # the installed bundle: starts in the sandbox, renders the setup window and the bar, exits
      - name: Smoke test
        shell: bash
        run: |
          flatpak install --user -y --noninteractive "Jollyboat-$version-linux-${{ matrix.file }}.flatpak"
          rc=0
          timeout 180 dbus-run-session -- xvfb-run -a \
            flatpak run --env=JOLLYBOAT_SMOKE=1 net.innovativefluid.Jollyboat > smoke.log 2>&1 || rc=$?
          cat smoke.log
          echo "::notice title=smoke (exit $rc)::$(grep -v '^\s*$' smoke.log | tail -n 40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -q '^\[smoke\] linux' smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: Jollyboat-*.flatpak

  # the self-updating linux build: an AppImage (static runtime, no libfuse2) plus the
  # latest-linux*.yml electron-updater reads from the release
  linux-appimage:
    needs: check
    if: ${{ inputs.targets != 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:appimage -- --${{ matrix.arch }}
      # the packaged app starts, renders the setup window and the bar, and exits. as a normal user
      # on ubuntu 24.04, where apparmor blocks user namespaces: AppRun has to add --no-sandbox
      - name: Smoke test
        shell: bash
        run: |
          timeout -k 10 120 sudo apt-get install -y xvfb > /dev/null || echo "::warning::xvfb install stalled"
          echo "::notice title=userns::apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          image=$(ls dist/*.AppImage | head -1)
          rc=0
          JOLLYBOAT_SMOKE=1 APPIMAGE_EXTRACT_AND_RUN=1 timeout 180 xvfb-run -a "$image" > smoke.log 2>&1 || rc=$?
          echo "::notice title=smoke (exit $rc)::$(grep -v '^\s*$' smoke.log | tail -n 30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -q '^\[smoke\] linux .*updater ok .*appimage' smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/latest-linux*.yml
