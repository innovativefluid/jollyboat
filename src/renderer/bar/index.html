<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Jollyboat</title>
    <link rel="stylesheet" href="../theme/theme.css" />
    <link rel="stylesheet" href="../theme/water.css" />
    <style>
      /* the bar above a server: the lcd look (dark tokens in theme.css), dark when the sharkord
         page below is (data-theme), else with the colour mode */
      html, body { height: 100%; }
      body { background: var(--bg); border-bottom: 2px solid var(--fg); box-sizing: border-box; }
      /* the bar is the window's title bar: drag it to move; buttons stay clickable */
      .bar { height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 0 0 10px; -webkit-app-region: drag; }
      button, .zoom span { -webkit-app-region: no-drag; }
      .controls { display: flex; align-self: stretch; margin-left: 6px; border-left: 2px solid var(--faint); }
      .controls button {
        width: 40px; height: 100%; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; color: var(--dim);
      }
      .controls button:hover { background: var(--faint); color: var(--fg); }
      .controls button#close:hover { background: var(--fg); color: var(--bg); }
      .controls svg { width: 12px; height: 12px; shape-rendering: crispEdges; }
      /* mac: the native traffic lights sit at the left of the bar */
      body.mac .bar { padding-left: 80px; padding-right: 8px; }
      body.mac .controls { display: none; }
      canvas.mark { width: 28px; height: 28px; image-rendering: pixelated; flex: none; }
      .name { font: 600 15px/1 var(--px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name .app { color: var(--dim); font-weight: 400; }
      .spacer { flex: 1; }
      .chip {
        height: 22px; padding: 0 10px; border-radius: 12px 6px 6px 12px; font: 600 13px/1 var(--px); cursor: pointer;
        background: transparent; color: var(--fg); border: 2px solid var(--dim); display: inline-flex; align-items: center;
      }
      .chip:nth-of-type(even) { border-radius: 6px 12px 12px 6px; }
      .chip:hover { border-color: var(--fg); }
      .chip:active { transform: translate(1px, 1px); }
      .chip.fill { background: var(--fg); color: var(--bg); border-color: var(--fg); }
      .zoom { display: flex; align-items: center; gap: 2px; }
      .zoom .chip { padding: 0 7px; }
      .zoom span { font: 400 13px/1 var(--px); color: var(--dim); min-width: 40px; text-align: center; cursor: pointer; }
      svg.mark-water { display: none; }

      /* the water look: a frosted glass bar, glass chips (the way to the settings filled with
         water), the boat smooth, bobbing on a line of water (moved by main.ts, a few times a second) */
      [data-look='water'] body {
        background:
          linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%),
          linear-gradient(to bottom, color-mix(in srgb, rgb(var(--w-glass)) 70%, rgb(var(--w-pool-top))), color-mix(in srgb, rgb(var(--w-glass)) 45%, rgb(var(--w-pool-mid))));
        border-bottom: 1px solid rgba(var(--w-edge), calc(var(--w-edge-a) + 0.15));
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.35);
      }
      [data-look='water'][data-theme='dark'] body { background: linear-gradient(to bottom, rgba(134, 226, 255, 0.1), rgba(134, 226, 255, 0) 55%), linear-gradient(to bottom, rgb(18, 52, 86), rgb(9, 33, 58)); }
      @media (prefers-color-scheme: dark) {
        [data-look='water']:not([data-theme]) body { background: linear-gradient(to bottom, rgba(134, 226, 255, 0.1), rgba(134, 226, 255, 0) 55%), linear-gradient(to bottom, rgb(18, 52, 86), rgb(9, 33, 58)); }
      }
      [data-look='water'] canvas.mark { display: none; }
      /* with webgl2 the bar is a glass slab over water, its chips glass bubbles (water/glass-dom.ts) */
      canvas.water { position: fixed; left: 0; top: 0; z-index: 0; pointer-events: none; }
      .bar { position: relative; z-index: 1; }
      [data-look='water'].gl body { background: transparent; border-bottom: 0; box-shadow: none; }
      [data-look='water'] svg.mark-water { display: block; width: 28px; height: 28px; flex: none; overflow: hidden; }
      [data-look='water'] .name { font: 800 14px/1 var(--w-font); color: rgb(var(--w-fg)); text-shadow: 0 1px 0 rgba(var(--w-text-glow), var(--w-text-glow-a)); }
      [data-look='water'] .name .app { color: rgb(var(--w-dim)); font-weight: 600; }
      [data-look='water'] .chip {
        position: relative; isolation: isolate; height: 24px; padding: 0 11px; font: 700 12.5px/1 var(--w-font);
        color: rgb(var(--w-fg)); text-shadow: 0 1px 0 rgba(var(--w-text-glow), var(--w-text-glow-a));
        border: 1px solid rgba(var(--w-edge), calc(var(--w-edge-a) + 0.12)); border-radius: 12px 8px 12px 8px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0) 52%), rgba(var(--w-btn), var(--w-btn-a));
        box-shadow: 0 2px 4px -1px rgba(var(--w-shade), var(--w-shade-a)), inset 0 -3px 5px -3px rgba(var(--w-light), var(--w-light-a));
        transition: transform 220ms cubic-bezier(0.3, 1.7, 0.5, 1), box-shadow 160ms;
      }
      [data-look='water'] .chip:nth-of-type(even) { border-radius: 8px 12px 8px 12px; }
      [data-look='water'] .chip:hover { border-color: rgba(var(--w-edge), calc(var(--w-edge-a) + 0.3)); box-shadow: 0 2px 4px -1px rgba(var(--w-shade), var(--w-shade-a)), 0 0 10px rgba(var(--w-glow), 0.5); }
      [data-look='water'] .chip:active { transform: scale(1.05, 0.93); }
      [data-look='water'] .chip.fill {
        color: #fff; font-weight: 800; text-shadow: 0 1px 1px rgba(var(--w-on-liq-shade), 0.95);
        background:
          linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.05) 48%, rgba(255, 255, 255, 0) 50%),
          linear-gradient(to top, rgb(var(--w-liq-b)), rgb(var(--w-liq-a)) 84%, rgba(255, 255, 255, 0.9) 87%, rgba(var(--w-btn), var(--w-btn-a)) 90%);
      }
      [data-look='water'] .zoom .chip { padding: 0 8px; }
      [data-look='water'] .zoom span { font: 700 12.5px/1 var(--w-font); color: rgb(var(--w-dim)); }
      [data-look='water'] .controls { border-left: 1px solid rgba(var(--w-edge), 0.35); }
      [data-look='water'] .controls button { color: rgb(var(--w-dim)); }
      [data-look='water'] .controls button:hover { background: rgba(var(--w-glow), 0.18); color: rgb(var(--w-fg)); }
      [data-look='water'] .controls button#close:hover { background: rgb(var(--w-warm)); color: #fff; }
      [data-look='water'] .controls svg { shape-rendering: auto; }
    </style>
  </head>
  <body>
    <div class="bar slab">
      <canvas class="mark" width="14" height="14"></canvas>
      <svg class="mark-water" viewBox="0 0 28 28" aria-hidden="true">
        <defs>
          <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: rgb(var(--w-liq-a))" /><stop offset="1" style="stop-color: rgb(var(--w-liq-b))" /></linearGradient>
        </defs>
        <g class="bob">
          <path d="M14.4 1.6V17.2" style="stroke: rgb(var(--w-dim))" stroke-width="1" stroke-linecap="round" />
          <path d="M15.2 2.8L24.2 12.6L23.4 14.4L15.2 14.6Z" style="fill: rgba(var(--w-spark), 0.85); stroke: rgba(var(--w-edge), 0.9)" stroke-width="0.8" stroke-linejoin="round" />
          <path d="M2.2 17H26.6L26.2 19.8L24.4 22.6H7.4Z" fill="url(#hull)" style="stroke: rgba(var(--w-edge), 0.95)" stroke-width="0.8" stroke-linejoin="round" />
          <path d="M5 18.2H25" style="stroke: rgba(255, 255, 255, 0.75)" stroke-width="0.7" stroke-linecap="round" />
        </g>
        <path class="flow" d="M0 24.2q2 -1.6 4 0t4 0t4 0t4 0t4 0t4 0t4 0t4 0t4 0" fill="none" style="stroke: rgb(var(--w-liq-a))" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      <div class="name"><span id="server"></span> <span class="app">| Jollyboat</span></div>
      <span class="spacer"></span>
      <div class="zoom" title="zoom (ctrl + / − / 0)" data-i18n-title>
        <button class="chip" id="zoom-out" aria-label="zoom out">−</button>
        <span id="zoom" title="actual size" data-i18n-title>100%</span>
        <button class="chip" id="zoom-in" aria-label="zoom in">+</button>
      </div>
      <button class="chip" id="popout" title="ctrl+shift+p" hidden data-i18n>pop out stream</button>
      <button class="chip fill" id="settings" title="ctrl+shift+s" data-i18n>servers and settings</button>
      <button class="chip" id="more" aria-label="more">⋯</button>
      <div class="controls">
        <button id="minimize" aria-label="minimize" title="minimize" data-i18n-title>
          <svg viewBox="0 0 12 12"><rect x="1" y="9" width="10" height="2" fill="currentColor" /></svg>
        </button>
        <button id="maximize" aria-label="maximize" title="maximize" data-i18n-title>
          <svg viewBox="0 0 12 12" id="max-icon"><path d="M1 1h10v10H1z M3 3v6h6V3z" fill="currentColor" fill-rule="evenodd" /></svg>
        </button>
        <button id="close" aria-label="close" title="close" data-i18n-title>
          <svg viewBox="0 0 12 12"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 3h2v2H7zM9 1h2v2H9zM3 7h2v2H3zM1 9h2v2H1zM7 7h2v2H7zM9 9h2v2H9z" fill="currentColor" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
