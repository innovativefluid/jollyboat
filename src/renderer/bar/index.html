<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Jollyboat</title>
    <link rel="stylesheet" href="../theme/theme.css" />
    <style>
      /* the bar above a server: the lcd look, light or dark with the system (the neg scheme) */
      /* dark when the sharkord page below is dark (data-theme), else when the system is */
      :root[data-theme='dark'] {
        --bg: #18201c; --panel: #202a24; --fg: #c4d6a6; --dim: #869672; --mute: #5e6c52;
        --faint: #384438; --line: #303c32; --spark: #ecf8ce; --shadow-a: 0.45;
        --fg-rgb: 196, 214, 166; --dim-rgb: 134, 150, 114;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg: #18201c; --panel: #202a24; --fg: #c4d6a6; --dim: #869672; --mute: #5e6c52;
          --faint: #384438; --line: #303c32; --spark: #ecf8ce; --shadow-a: 0.45;
          --fg-rgb: 196, 214, 166; --dim-rgb: 134, 150, 114;
        }
      }
      html, body { height: 100%; }
      body { background: var(--bg); border-bottom: 2px solid var(--fg); box-sizing: border-box; }
      /* the bar is the window's title bar: drag it to move; buttons stay clickable */
      .bar { height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 0 0 10px; -webkit-app-region: drag; }
      button, .zoom span { -webkit-app-region: no-drag; }
      .controls { display: flex; align-self: stretch; margin-left: 6px; border-left: 2px solid var(--faint); }
      .controls button {
        width: 40px; height: 100%; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; color: var(--dim);
      }
      .controls button:hover { background: var(--faint); color: var(--fg); }
      .controls button#close:hover { background: var(--fg); color: var(--bg); }
      .controls svg { width: 12px; height: 12px; shape-rendering: crispEdges; }
      /* mac: the native traffic lights sit at the left of the bar */
      body.mac .bar { padding-left: 80px; padding-right: 8px; }
      body.mac .controls { display: none; }
      canvas.mark { width: 28px; height: 28px; image-rendering: pixelated; flex: none; }
      .name { font: 600 15px/1 var(--px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name .app { color: var(--dim); font-weight: 400; }
      .spacer { flex: 1; }
      .chip {
        height: 22px; padding: 0 10px; border-radius: 12px 6px 6px 12px; font: 600 13px/1 var(--px); cursor: pointer;
        background: transparent; color: var(--fg); border: 2px solid var(--dim); display: inline-flex; align-items: center;
      }
      .chip:nth-of-type(even) { border-radius: 6px 12px 12px 6px; }
      .chip:hover { border-color: var(--fg); }
      .chip:active { transform: translate(1px, 1px); }
      .chip.fill { background: var(--fg); color: var(--bg); border-color: var(--fg); }
      .zoom { display: flex; align-items: center; gap: 2px; }
      .zoom .chip { padding: 0 7px; }
      .zoom span { font: 400 13px/1 var(--px); color: var(--dim); min-width: 40px; text-align: center; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="bar">
      <canvas class="mark" width="14" height="14"></canvas>
      <div class="name"><span id="server"></span> <span class="app">| Jollyboat</span></div>
      <span class="spacer"></span>
      <div class="zoom" title="zoom (ctrl + / − / 0)">
        <button class="chip" id="zoom-out" aria-label="zoom out">−</button>
        <span id="zoom" title="actual size">100%</span>
        <button class="chip" id="zoom-in" aria-label="zoom in">+</button>
      </div>
      <button class="chip fill" id="settings" title="ctrl+shift+s">servers and settings</button>
      <button class="chip" id="more" aria-label="more">⋯</button>
      <div class="controls">
        <button id="minimize" aria-label="minimize" title="minimize">
          <svg viewBox="0 0 12 12"><rect x="1" y="9" width="10" height="2" fill="currentColor" /></svg>
        </button>
        <button id="maximize" aria-label="maximize" title="maximize">
          <svg viewBox="0 0 12 12" id="max-icon"><path d="M1 1h10v10H1z M3 3v6h6V3z" fill="currentColor" fill-rule="evenodd" /></svg>
        </button>
        <button id="close" aria-label="close" title="close">
          <svg viewBox="0 0 12 12"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 3h2v2H7zM9 1h2v2H9zM3 7h2v2H3zM1 9h2v2H1zM7 7h2v2H7zM9 9h2v2H9z" fill="currentColor" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
