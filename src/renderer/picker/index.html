<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>share your screen</title>
    <link rel="stylesheet" href="../theme/theme.css" />
    <style>
      .page { padding: 12px 16px; }
      .panel.grow { flex: 1; min-height: 0; }
      .grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-content: start; gap: 10px; padding: 4px 2px 8px; }
      .grid::-webkit-scrollbar { width: 0; }
      .source { background: var(--panel); border: 2px solid var(--faint); border-radius: 10px 16px 10px 16px; padding: 6px; cursor: pointer; text-align: left; color: var(--fg); }
      .source.on { border-color: var(--fg); box-shadow: 3px 3px 0 var(--shadow); }
      .source img.thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: var(--faint); border-radius: 6px; image-rendering: auto; }
      .source .label { display: flex; gap: 6px; align-items: center; margin-top: 6px; font: 400 12px/1.1 var(--px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .source .label img { width: 14px; height: 14px; }
      .foot { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel grow">
        <div class="row">
          <div class="panel-title" style="margin: 0">share your screen</div>
          <span class="spacer"></span>
          <div class="seg" id="kind"></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="foot">
          <span class="spacer"></span>
          <button class="pill minor small" id="cancel">cancel</button>
          <button class="pill small alt" id="share" disabled>share</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
