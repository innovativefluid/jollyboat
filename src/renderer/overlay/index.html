<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Jollyboat voice</title>
    <link rel="stylesheet" href="../theme/theme.css" />
    <link rel="stylesheet" href="../theme/water.css" />
    <link rel="stylesheet" href="../theme/retro.css" />
    <style>
      /* the voice overlay: the lcd look on a see-through window. the background takes the opacity
         from the settings; text and the talking fill stay solid, with an outline in the
         background colour so they read over anything */
      :root { --bg-rgb: 176, 186, 148; --alpha: 0.75; }
      :root[data-theme='dark'] {
        --bg: #18201c; --panel: #202a24; --fg: #c4d6a6; --dim: #869672; --mute: #5e6c52; --faint: #384438;
        --fg-rgb: 196, 214, 166; --bg-rgb: 32, 42, 36;
      }
      /* (more specific than the looks' page backgrounds, which load after this) */
      html:root, html:root body { background: transparent; height: auto; overflow: hidden; }
      body { padding: 4px; }
      .card {
        background: rgba(var(--bg-rgb), var(--alpha));
        border: 2px solid rgba(var(--fg-rgb), max(var(--alpha), 0.0));
        border-radius: 10px 4px 10px 4px;
        padding: 5px 6px 6px;
        --outline: rgba(var(--bg-rgb), calc(1 - var(--alpha) * 0.6));
        text-shadow: 1px 0 var(--outline), -1px 0 var(--outline), 0 1px var(--outline), 0 -1px var(--outline);
      }
      .head { display: flex; align-items: center; gap: 4px; font: 500 12px/1 var(--px); color: var(--dim); padding: 1px 2px 5px 4px; }
      .head .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      /* being placed: draggable, a dashed edge, and the done button */
      :root.positioning .card { -webkit-app-region: drag; cursor: move; border-style: dashed; border-color: var(--fg); }
      .place { display: none; align-items: center; gap: 6px; padding: 6px 2px 1px 4px; font: 500 12px/1.2 var(--px); color: var(--dim); }
      :root.positioning .place { display: flex; }
      .place span { flex: 1; }
      .place button {
        -webkit-app-region: no-drag; cursor: pointer; padding: 3px 10px; font: 600 12px/1 var(--px);
        background: var(--fg); color: var(--bg); border: 2px solid var(--fg); border-radius: 10px 4px 10px 4px;
      }
      .rows { display: flex; flex-direction: column; gap: 2px; }
      .row { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 4px; font: 600 14px/1.1 var(--px); color: var(--fg); }
      .row .who { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .row .self { color: var(--dim); font-weight: 400; }
      /* speaking: fill instead of outline, the lcd way of emphasis */
      .dot { width: 9px; height: 9px; border: 2px solid var(--dim); border-radius: 2px; flex: none; }
      .row.talking { background: var(--fg); color: var(--bg); text-shadow: none; }
      .row.talking .dot { background: var(--bg); border-color: var(--bg); }
      .row.talking .self { color: var(--bg); }
      .row.quiet .who { color: var(--dim); }
      .icons { display: flex; gap: 3px; flex: none; }
      .icons svg { width: 12px; height: 12px; shape-rendering: crispEdges; display: block; }
      .empty { font: 500 13px/1.2 var(--px); color: var(--dim); padding: 2px 5px; }

      /* the water look: a frosted glass card; whoever talks is filled with water. the slider's
         opacity is the glass's; text keeps a halo of the glass colour so it reads over anything */
      [data-look='water'] .card {
        background:
          linear-gradient(to bottom, rgba(255, 255, 255, calc(var(--alpha) * 0.45)), rgba(255, 255, 255, 0) 30px),
          rgba(var(--w-glass), max(var(--alpha), 0.0));
        border: 1px solid rgba(var(--w-edge), max(calc(var(--w-edge-a) + 0.2), var(--alpha)));
        border-radius: 19px 9px 19px 9px;
        padding: 6px 7px 7px;
        --outline: rgba(var(--w-glass), calc(1 - var(--alpha) * 0.5));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--alpha) * 0.6));
      }
      [data-look='water'] .head { font: 700 12px/1 var(--w-font); color: rgb(var(--w-dim)); }
      [data-look='water'] .row { font: 800 14px/1.15 var(--w-font); color: rgb(var(--w-fg)); border-radius: 12px 7px 12px 7px; padding: 3px 7px; }
      [data-look='water'] .row .self { color: rgb(var(--w-dim)); font-weight: 600; }
      [data-look='water'] .row.quiet .who { color: rgb(var(--w-dim)); }
      [data-look='water'] .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(var(--w-edge), 0.8); background: rgba(var(--w-btn), 0.6); }
      [data-look='water'] .row.talking {
        color: #fff;
        text-shadow: 0 1px 1px rgba(var(--w-on-liq-shade), 0.95);
        background:
          linear-gradient(to bottom, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 50%),
          linear-gradient(to top, rgb(var(--w-liq-b)), rgb(var(--w-liq-a)) 86%, rgba(255, 255, 255, 0.9) 90%, rgb(var(--w-liq-a)) 94%);
        box-shadow: 0 0 10px rgba(var(--w-glow), 0.6);
      }
      [data-look='water'] .row.talking .dot { background: #fff; border-color: #fff; }
      [data-look='water'] .row.talking .self { color: rgba(255, 255, 255, 0.85); }
      [data-look='water'] .icons svg { shape-rendering: auto; }
      [data-look='water'] .empty { font: 600 13px/1.2 var(--w-font); color: rgb(var(--w-dim)); }
      [data-look='water'] .place { font: 600 12px/1.2 var(--w-font); color: rgb(var(--w-dim)); }
      /* the retro look: a small window, a pink title bar on top, whoever talks picked out in hot
         pink like a selected file */
      [data-look='retro'] .card {
        background: rgba(var(--r-face-rgb, 255, 233, 244), max(var(--alpha), 0.0));
        border: 0; border-radius: 0; padding: 0 3px 4px;
        box-shadow: inset -1px -1px var(--r-dark), inset 1px 1px var(--r-light);
        --outline: rgba(var(--r-face-rgb, 255, 233, 244), calc(1 - var(--alpha) * 0.5));
      }
      [data-look='retro'][data-theme='dark'] .card { --r-face-rgb: 45, 27, 61; }
      [data-look='retro'][data-palette='green'] .card { --r-face-rgb: 234, 250, 243; }
      [data-look='retro'][data-palette='green'][data-theme='dark'] .card { --r-face-rgb: 19, 49, 48; }
      [data-look='retro'] .head { margin: 0 -3px 4px; padding: 4px 6px; font: 700 12px/1 var(--r-title-font); color: var(--r-title-ink); background: linear-gradient(90deg, var(--r-title-a), var(--r-title-b)); text-shadow: none; }
      [data-look='retro'] .head::before { content: '♥'; margin-right: 2px; }
      [data-look='retro'] .row { font: 400 14px/1.15 var(--r-font); color: var(--r-ink); border-radius: 0; }
      [data-look='retro'] .row .self, [data-look='retro'] .row.quiet .who { color: var(--r-dim); }
      [data-look='retro'] .dot { width: 9px; height: 9px; border: 0; border-radius: 0; background: var(--r-field); box-shadow: inset 1px 1px var(--r-shadow), inset -1px -1px var(--r-light); }
      [data-look='retro'] .row.talking { background: var(--r-sel); color: var(--r-sel-ink); text-shadow: none; }
      [data-look='retro'] .row.talking .dot { background: #fff; box-shadow: none; }
      [data-look='retro'] .row.talking .self { color: var(--r-sel-ink); }
      [data-look='retro'] .empty, [data-look='retro'] .place { font: 400 13px/1.2 var(--r-font); color: var(--r-dim); }
      [data-look='retro'] .place button { font: 400 12px/1 var(--r-font); color: #fff; border: 0; border-radius: 0; padding: 4px 10px; background: var(--r-accent); box-shadow: inset -1px -1px var(--r-dark), inset 1px 1px var(--r-accent-hi); }
      [data-look='water'] .place button {
        font: 800 12px/1 var(--w-font); color: #fff; border: 1px solid rgba(var(--w-edge), 0.8); border-radius: 12px 7px 12px 7px; padding: 4px 11px;
        background: linear-gradient(to top, rgb(var(--w-liq-b)), rgb(var(--w-liq-a)));
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <span class="name" id="channel">voice</span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="place"><span data-i18n>drag it where you want it</span><button id="done" data-i18n>done</button></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
